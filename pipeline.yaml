input:
  kind: "mjpeg"
  spec:
    url: "http://source:1984/api/stream.mjpeg?src=example"
    frame_interval: 60    
    read_timeout: 30

output:
  kind: "mjpeg"
  spec: 
    port: 7777
    path: "/stream"

flow:
  type: "sequence"
  name: "xinet-pipeline"
  nodes:
    - type: "service"
      name: "xinet-pose-service"
      config:
        kind: "openinference"
        spec:
          address: "xinet-pose:9000"
          model_name: "XiNet-s-pose"
          num_instances: 1  
          timeout: 15   

          input_tensor_spec:
            - name: "image"
              datatype: "UINT8"
              shape: [-1, -1]
          
          output_tensor_spec:
            - name: "image"
              datatype: "UINT8"
              shape: [-1, -1]
          
          output_template: |
            {{. | jp "$.outputs[0].data" | raw}}
  
